[project]
name = "pai700-final-project"
version = "0.1.0"
description = "Digital twin of a school classroom heating system (PAI700)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.106",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
