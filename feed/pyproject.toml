[project]
name = "pai700-feed"
version = "0.1.0"
description = "Frozen dataset window and replay feed shared by the twin, the AI model and the dashboard (PAI700)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
